app-id: io.github.fastrizwaan.StiloNotes
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: stilonotes
finish-args:
  - --share=ipc
  - --socket=fallback-x11
  - --socket=wayland
  - --device=dri
  - --filesystem=xdg-run/gvfs
  - --filesystem=home
  - --env=WEBKIT_DISABLE_DMABUF_RENDERER=1

cleanup:
  - "*.a"
  - "*.la"
  - "/include"
  - "/lib/pkgconfig"
  - "/share/man"

modules:
  - name: StiloNotes
    buildsystem: meson
    sources:
      - type: dir
        path: ..
