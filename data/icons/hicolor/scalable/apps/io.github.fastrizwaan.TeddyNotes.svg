<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Adwaita Squircle Background with gradient -->
  <defs>
    <linearGradient id="bearBg" x1="16" y1="12" x2="112" y2="116" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E54D42"/>
      <stop offset="100%" stop-color="#C82B22"/>
    </linearGradient>
    <linearGradient id="bearShine" x1="64" y1="12" x2="64" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="softShadow" x="0" y="4" width="128" height="124" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Base Rounded Squircle with Shadow -->
  <rect x="12" y="12" width="104" height="104" rx="26" fill="url(#bearBg)" filter="url(#softShadow)"/>
  <!-- Top Highlight -->
  <rect x="12" y="12" width="104" height="52" rx="26" fill="url(#bearShine)"/>

  <!-- Teddy Bear Silhouette (Pure White) -->
  <g fill="#FFFFFF">
    <!-- Left Ear -->
    <circle cx="43" cy="45" r="14"/>
    <!-- Right Ear -->
    <circle cx="85" cy="45" r="14"/>
    <!-- Inner Left Ear -->
    <circle cx="43" cy="45" r="7" fill="#E54D42" fill-opacity="0.3"/>
    <!-- Inner Right Ear -->
    <circle cx="85" cy="45" r="7" fill="#E54D42" fill-opacity="0.3"/>

    <!-- Head -->
    <ellipse cx="64" cy="56" rx="26" ry="23" fill="#FFFFFF"/>

    <!-- Snout (Slightly warmer white) -->
    <ellipse cx="64" cy="62" rx="14" ry="11" fill="#F8F9FA"/>
    <!-- Nose (Cute dark triangle/oval) -->
    <path d="M 59 58 Q 64 56 69 58 Q 64 64 59 58 Z" fill="#2E2E32"/>
    <!-- Mouth line -->
    <path d="M 64 62 L 64 66" stroke="#2E2E32" stroke-width="2" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="53" cy="52" r="3.2" fill="#2E2E32"/>
    <circle cx="75" cy="52" r="3.2" fill="#2E2E32"/>
    <!-- Eye highlights -->
    <circle cx="54" cy="51" r="1" fill="#FFFFFF"/>
    <circle cx="76" cy="51" r="1" fill="#FFFFFF"/>

    <!-- Body / Shoulders -->
    <path d="M 36 86 C 36 74, 46 72, 64 72 C 82 72, 92 74, 92 86 C 92 98, 86 102, 64 102 C 42 102, 36 98, 36 86 Z" fill="#FFFFFF"/>

    <!-- Tiny pencil / notebook icon held in paws or note badge -->
    <rect x="53" y="78" width="22" height="16" rx="3" fill="#E54D42"/>
    <line x1="57" y1="83" x2="69" y2="83" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="57" y1="88" x2="66" y2="88" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
  </g>
</svg>
